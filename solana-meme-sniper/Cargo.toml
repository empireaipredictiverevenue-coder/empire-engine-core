[package]
name = "solana-meme-sniper"
version = "1.0.0"
edition = "2021"
description = "Production-grade Solana Meme Sniper Bot — real-time WebSocket pool detection, anti-rug security matrix, Jupiter swap + Jito Block Engine bundle execution."
license = "MIT"

[dependencies]
# ── Solana core (all synced to 2.3) ─────────────────────────────────
solana-client = "2.3"
solana-sdk = "2.3"
solana-transaction-status = "2.3"
solana-account-decoder = "2.3"
solana-rpc-client-api = "2.3"
solana-program = "2.3"

# ── SPL Token + Associated Token Account ────────────────────────────
spl-token = "9.0"
spl-associated-token-account = "6.0"

# ── Jito Block Engine (raw JSON-RPC via reqwest) ───────────────────

# ── Async runtime + WebSocket ───────────────────────────────────────
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"

# ── Serialization ───────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1.6", features = ["derive"] }
bs58 = "0.5"
bincode = "1.3"

# ── Networking ──────────────────────────────────────────────────────
reqwest = { version = "0.12", features = ["json"] }

# ── REST API server (tracker endpoints) ──────────────────────────────
axum = "0.8"
tower = "0.5"
http-body-util = "0.1"

# ── Error handling ──────────────────────────────────────────────────
anyhow = "1.0"
thiserror = "2.0"

# ── Logging + tracing ───────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Misc ────────────────────────────────────────────────────────────
base64 = "0.22"
hex = "0.4"
dotenv = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
