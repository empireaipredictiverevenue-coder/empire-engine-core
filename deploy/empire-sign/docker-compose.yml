# Empire Sign — White-labeled DocuSeal for contractor agreements & fee contracts
# Deployed: 2026-06-21 | Port: 8090 | Stack: Ruby on Rails + PostgreSQL 18
version: '3.8'

services:
  app:
    image: docuseal/docuseal:latest
    ports:
      - "8090:3000"
    environment:
      - HOST=empire-ai.co.uk
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/docuseal
      - SECRET_KEY_BASE=${EMPIRE_SIGN_SECRET:-empire-sign-prod-change-me}
      - APP_NAME=Empire Sign
    volumes:
      - ./data:/data/docuseal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - empire-sign

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=docuseal
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - empire-sign

networks:
  empire-sign:
    driver: bridge
