# Empire Chatwoot — Nginx Subdomain Config
# Activate when SSL cert is expanded to cover chat.empire-ai.co.uk
#
# Before activating:
#   certbot --expand -d empire-ai.co.uk -d www.empire-ai.co.uk \
#     -d chat.empire-ai.co.uk
#
# Chatwoot requires underscores_in_headers on!
#
# Enable:
#   ln -sf /root/empire-v49/deploy/nginx-empire-chatwoot.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name chat.empire-ai.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name chat.empire-ai.co.uk;

    ssl_certificate /etc/letsencrypt/live/empire-ai.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/empire-ai.co.uk/privkey.pem;

    # Chatwoot requires underscores in custom headers
    underscores_in_headers on;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Ssl on;

        # Chatwoot long-polling and websocket support
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Chatwoot webhook endpoint for Facebook — proxied to our hub
    # Facebook sends webhook events to chat.empire-ai.co.uk/bot
    # which Chatwoot handles internally.
    # Our hub at empire-ai.co.uk/webhook/facebook-bot receives
    # Chatwoot's forwarded events.
}
