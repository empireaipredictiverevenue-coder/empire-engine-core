# Empire AI — Nginx Subdomain Routing for Self-Hosted Products
# Template — not yet activated. Copy to /etc/nginx/sites-enabled/ when SSL certs
# are expanded to cover subdomains (sign/workspace/analytics/studio.empire-ai.co.uk).
#
# BEFORE ACTIVATING: expand the cert to cover subdomains:
#   certbot --expand -d empire-ai.co.uk -d www.empire-ai.co.uk \
#     -d sign.empire-ai.co.uk -d workspace.empire-ai.co.uk \
#     -d analytics.empire-ai.co.uk -d studio.empire-ai.co.uk
#
# Each product runs on localhost:<port> via Docker Compose in deploy/<name>/

# Empire Sign — Document Signing (DocuSeal)
server {
    listen 80;
    server_name sign.empire-ai.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sign.empire-ai.co.uk;

    ssl_certificate /etc/letsencrypt/live/empire-ai.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/empire-ai.co.uk/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

