# Empire Workspace — White-labeled Affine for team docs, whiteboards & kanban
# Deployed: 2026-06-21 | Port: 8091 | Stack: Rust + TypeScript + PostgreSQL + Redis
version: '3.8'

services:
  affine:
    image: ghcr.io/toeverything/affine:stable
    ports:
      - "8091:3000"
    environment:
      - AFFINE_SERVER_HOST=0.0.0.0
      - AFFINE_SERVER_PORT=3000
      - AFFINE_SERVER_HTTPS=false
      - DATABASE_URL=postgresql://affine:affine@postgres:5432/affine
      - REDIS_SERVER_HOST=redis
      - REDIS_SERVER_PORT=6379
      - AFFINE_ADMIN_EMAIL=admin@empire-ai.co.uk
      - AFFINE_ADMIN_PASSWORD=empire-workspace-admin
      - AFFINE_JWT_SECRET=${EMPIRE_WORKSPACE_SECRET:-empire-workspace-jwt-change-me}
      - AFFINE_SERVER_DB_SYNC=true
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - empire-workspace

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=affine
      - POSTGRES_PASSWORD=affine
      - POSTGRES_DB=affine
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affine"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - empire-workspace

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - empire-workspace

networks:
  empire-workspace:
    driver: bridge
