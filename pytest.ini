[pytest]
# ────────────────────────────────────────────────────────────────────────────
# EMPIRE V49 · pytest configuration
# ────────────────────────────────────────────────────────────────────────────
# Test discovery: only pick up files matching test_*.py inside the tests/ dir
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output: verbose by default, with short tracebacks (full tracebacks are
# available via `pytest --tb=long` when debugging a specific failure)
addopts = -v --tb=short --strict-markers

# Filter noisy third-party warnings that don't affect test outcomes
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning

# Markers (use `pytest -m "marker"` to run a subset)
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that hit external services (Supabase, Ollama, etc.)
    unit: fast unit tests with no external dependencies
