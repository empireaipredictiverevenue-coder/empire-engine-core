# Empire V49 · Dokku nginx WebSocket config
# ──────────────────────────────────────────
# Place this at: /home/dokku/empire-ai-uk/nginx.conf.d/websocket.conf
# Or, even simpler, run on the Hetzner box:
#
#   dokku nginx:set empire-ai-uk proxy-read-timeout 3600s
#   dokku nginx:set empire-ai-uk proxy-send-timeout 3600s
#   dokku proxy:build-config empire-ai-uk
#
# This file is a fallback — explicit WebSocket location block in case Dokku
# upgrades change the default behaviour.

location /ws/live {
    proxy_pass http://$upstream_host:$upstream_port/ws/live;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket connections can be long-lived. 1 hour timeout is fine —
    # the client auto-reconnects on disconnect anyway.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Disable buffering for real-time push
    proxy_buffering off;
}
