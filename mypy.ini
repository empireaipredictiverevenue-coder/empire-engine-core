# EMPIRE V49 · mypy configuration
# ==================================
# Pragmatic config: the project is mostly untyped, so we use lenient defaults
# to avoid noise. We DO enable strict type checking on the new injection-pattern
# files so the TYPE_CHECKING-guarded `Optional["StrategyEvolution"]` and
# `Optional["SupabaseClient"]` hints are actually enforced.
#
# Run with:  mypy                    # checks everything per [mypy] defaults below
#            mypy bots/agi_lane_engine.py
#
# The CI workflow (.github/workflows/test.yml) runs mypy as a separate step.

[mypy]
# Python version — matches runtime.txt (python-3.11.10)
python_version = 3.11

# Don't require all functions to be annotated — too much noise in this codebase
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_incomplete_defs = False

# But DO check the bodies of annotated functions (where the type hints live)
check_untyped_defs = False

# Be strict about explicit Any and unused ignores
warn_unused_ignores = True
warn_return_any = True

# Don't check missing imports for third-party libs (supabase, ollama, etc.)
ignore_missing_imports = True

# Don't follow imports into untyped modules — they generate cascades of
# "untyped" errors that drown out the real signal
follow_imports = silent

# CI hygiene
no_incremental = True
show_error_codes = True
pretty = True

# Per-module overrides: enforce type hints on the new injection-pattern files
# These are the files that have been refactored to use TYPE_CHECKING-guarded
# forward references and constructor injection — the type hints are the
# contract, and we want mypy to enforce them.
#
# We set `check_untyped_defs = True` + `warn_return_any = True` but NOT
# `disallow_untyped_defs = True` — the refactored files still have many
# untyped helpers (e.g., the `while True:` loop in `run_loop`), and we
# don't want to block on those. The important checks are:
#   - `check_untyped_defs = True`: check the BODIES of typed functions
#     (where the Optional["StrategyEvolution"] hint lives)
#   - `warn_return_any = True`: catch implicit Any returns from typed fns
#   - `warn_unused_ignores = True`: catch sloppy `# type: ignore` comments

[mypy-bots.agi_lane_engine]
# 32-lane engine — has Optional["StrategyEvolution"] hint on si_strategy
check_untyped_defs = True
warn_unused_ignores = True
warn_return_any = True

[mypy-bots.hermes_controller]
# GodMode controller — has Optional["SupabaseClient"] hint on sb
check_untyped_defs = True
warn_unused_ignores = True
warn_return_any = True

[mypy-bots.panel_court]
# 10-agent ensemble — has Optional["SupabaseClient"] hint on sb
check_untyped_defs = True
warn_unused_ignores = True
warn_return_any = True

[mypy-bots.predictive_revenue]
# Revenue engine — has the si_strategy setter + feed_si_evolution
check_untyped_defs = True
warn_unused_ignores = True
warn_return_any = True

[mypy-empire_agi_governor]
# AGI governor — has the set_si_strategy classmethod
check_untyped_defs = True
warn_unused_ignores = True
warn_return_any = True

[mypy-empire_si_strategy]
# StrategyEvolution — the canonical shared instance class
check_untyped_defs = True
warn_unused_ignores = True
warn_return_any = True

[mypy-tests.*]
# Lenient checking for tests — we don't want to block on untyped test helpers
disallow_untyped_defs = False
check_untyped_defs = False

# Third-party libs — just ignore missing stubs
[mypy-supabase.*]
ignore_missing_imports = True

[mypy-httpx.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-asyncio.*]
ignore_missing_imports = True
