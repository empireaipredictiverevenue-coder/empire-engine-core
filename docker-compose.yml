# ═══════════════════════════════════════════════════════════════════════════
# EMPIRE AI V49 · WHITE-LABEL SUITE ORCHESTRATION
# ═══════════════════════════════════════════════════════════════════════════
# Full-service orchestration: hub, suite gateway, synthetic brain, and
# per-partner branded containers.
#
# Usage:
#   docker compose up -d                     # start all core services
#   docker compose up -d partner_acme        # start a specific partner
#   docker compose run --rm cli provision --name "Acme" --tier enterprise
#   docker compose logs -f hub
#
# Partner containers inherit the hub image with per-partner env vars for
# branding, tier limits, and revenue splits.
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ── Core Hub (internal) ───────────────────────────────────────────────
  hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: empire-hub
    ports:
      - "8000:8001"
    env_file:
      - /root/.env
    environment:
      - CONTAINER_MODE=hub
      - HUB_PORT=8001
      - PARTNER_ID=empire_official
      - PARTNER_NAME=Empire AI
    volumes:
      - /root/.env:/root/.env:ro
      - empire_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/api/hub/diagnostics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - empire-net

  # ── Suite Gateway (port 8040) ─────────────────────────────────────────
  suite-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: empire-suite-gateway
    ports:
      - "8040:8040"
    env_file:
      - /root/.env
    environment:
      - CONTAINER_MODE=suite
      - SUITE_PORT=8040
    command: ["python3", "-m", "uvicorn", "suite_core:standalone_app", "--host", "0.0.0.0", "--port", "8040"]
    volumes:
      - empire_data:/app/data
    restart: unless-stopped
    networks:
      - empire-net

  # ── Synthetic Brain (port 8005) ───────────────────────────────────────
  synthetic-brain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: empire-synthetic-brain
    ports:
      - "8005:8005"
    env_file:
      - /root/.env
    environment:
      - CONTAINER_MODE=brain
      - SYNTHETIC_BRAIN_PORT=8005
    command: ["python3", "-m", "uvicorn", "synthetic_brain:app", "--host", "0.0.0.0", "--port", "8005"]
    volumes:
      - empire_data:/app/data
    restart: unless-stopped
    networks:
      - empire-net

  # ── White-Label Provisioner CLI ───────────────────────────────────────
  # Run: docker compose run --rm cli --help
  cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: empire-cli
    entrypoint: ["python3", "empire_white_label.py"]
    profiles:
      - cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /root/.env:/root/.env:ro
    networks:
      - empire-net

