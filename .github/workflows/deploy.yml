name: Deploy & Smoke Test

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: "production"
        type: choice
        options:
          - production

jobs:
  smoke-test:
    name: SPA Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # No external services — supabase calls are mocked by the hub env

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon0 \
            libxdamage1 \
            libxcomposite1 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            xvfb
          echo "✅ System deps installed"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install uvicorn httpx
          echo "✅ Python deps installed"

      - name: Install Chrome (headless)
        run: |
          wget -q -O /tmp/chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/chrome.deb 2>/dev/null || \
            sudo apt-get install -fy -qq
          google-chrome --version
          echo "✅ Chrome installed"

      - name: Start Xvfb + Chrome headless debugging
        run: |
          # Start Xvfb
          Xvfb :99 -screen 0 1920x1080x24 &>/dev/null &
          sleep 2

          # Start Chrome
          export DISPLAY=:99
          google-chrome \
            --no-sandbox \
            --headless=new \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/ci-chrome-profile \
            --disable-dev-shm-usage \
            --disable-gpu \
            --disable-software-rasterizer \
            &>/tmp/chrome-ci.log &

          # Wait for Chrome to be ready
          for i in $(seq 1 20); do
            if curl -s http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              echo "✅ Chrome ready on port 9222"
              break
            fi
            sleep 1
          done
          curl -s http://127.0.0.1:9222/json/version 2>/dev/null | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Chrome {d[\"Browser\"]}')"

      - name: Start Hub
        run: |
          # Start hub with minimal env (no external services needed for SPA render)
          HUB_TOKEN=ci-test-token \
          SUPABASE_URL="" \
          SUPABASE_ANON_KEY="" \
          SUPABASE_SERVICE_KEY="" \
          uvicorn hub:app --host 127.0.0.1 --port 8000 --log-level warning &>/tmp/hub-ci.log &
          HUB_PID=$!

          # Wait for hub to be ready — fail the step if it doesn't boot
          for i in $(seq 1 20); do
            if curl -s http://127.0.0.1:8000/api/market-pulse >/dev/null 2>&1; then
              echo "✅ Hub ready on port 8000 (PID $HUB_PID)"
              echo "HUB_PID=$HUB_PID" >> $GITHUB_ENV
              exit 0
            fi
            sleep 1
          done

          echo "❌ Hub failed to start within 20s"
          cat /tmp/hub-ci.log | tail -30
          kill $HUB_PID 2>/dev/null || true
          exit 1

      - name: Run SPA Smoke Test
        run: |
          python scripts/smoke_test_spa.py --url http://127.0.0.1:8000

      - name: Verify Chrome Debugging (browser-use compat)
        run: |
          curl -s http://127.0.0.1:9222/json/version | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Chrome debugging OK: {d[\"Browser\"]}')"
          curl -s http://127.0.0.1:9222/json | \
            python3 -c "import sys,json; targets=json.load(sys.stdin); print(f'Pages open: {len(targets)}')"

      - name: Deploy (on push to master/main)
        if: github.ref_name == 'master' || github.ref_name == 'main'
        run: |
          echo "🚀 Deployment would go here (e.g., invoke deploy.sh)"
          echo "Currently configured for: ${{ github.ref_name }}"
          # Uncomment and configure for actual deployment:
          # bash deploy.sh

      - name: Upload CI logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            /tmp/hub-ci.log
            /tmp/chrome-ci.log
          retention-days: 7

      - name: Upload SPA page on failure
        if: failure()
        run: |
          curl -s http://127.0.0.1:8000/command -o /tmp/spa-page-failure.html 2>/dev/null || true
          echo "SPA page saved to /tmp/spa-page-failure.html"

      - name: Upload artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spa-page-failure
          path: /tmp/spa-page-failure.html
          retention-days: 7
