version: "3.9"
services:
  empire-customer:
    build:
      context: .
      dockerfile: Dockerfile.customer
    container_name: empire-ai-customer
    restart: unless-stopped
    env_file:
      - .env.customer
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get(http://localhost:8080/health, timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
